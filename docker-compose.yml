# Local PostgreSQL for development: `docker compose up -d`
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kamkaroai
      POSTGRES_PASSWORD: kamkaroai
      POSTGRES_DB: kamkaroai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
